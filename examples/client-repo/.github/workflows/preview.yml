name: Craft preview

# A preview is built for PRs carrying the `preview` label, rebuilt on every push to them,
# and removed when the label goes, the PR closes, or the nightly sweep finds it stale.
on:
  pull_request:
    types: [labeled, unlabeled, synchronize, reopened, closed]
  schedule:
    - cron: "0 3 * * *" # nightly sweep of closed, unlabelled and stale previews
  workflow_dispatch: # manual sweep

permissions:
  contents: read
  pull-requests: write

concurrency:
  # One run at a time per PR, and never cancel mid-provision.
  group: craft-preview-${{ github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # A closed PR's merge ref may be gone, so teardown reads config from the default branch.
          ref: ${{ github.event.action == 'closed' && github.event.repository.default_branch || '' }}
          # The manifest, and the site's example env that the preview .env is built on.
          sparse-checkout: |
            .craft-preview.json
            .env.example
            .env.example.dev
          sparse-checkout-cone-mode: false

      - id: preview
        uses: netliferesearch/craft-preview@v1
        with:
          forge-token: ${{ secrets.FORGE_API_TOKEN }}
          forge-org: ${{ vars.FORGE_ORG }}
          forge-server-id: ${{ vars.FORGE_PREVIEW_SERVER_ID }}
          preview-secret: ${{ secrets.PREVIEW_SECRET }}
          basic-auth-password: ${{ secrets.PREVIEW_BASIC_AUTH_PASSWORD }}
          snapshot-key: ${{ secrets.SNAPSHOT_READ_KEY }}
          snapshot-secret: ${{ secrets.SNAPSHOT_READ_SECRET }}
          # Client-specific secrets appended to the preview's .env, e.g. read-only asset credentials:
          # extra-env: |
          #   S3_KEY=${{ secrets.S3_READ_KEY }}
          #   S3_SECRET=${{ secrets.S3_READ_SECRET }}

      # The preview URL is available to later steps, e.g. for Playwright or visual diffs:
      # - run: npx playwright test
      #   if: steps.preview.outputs.url != ''
      #   env:
      #     BASE_URL: ${{ steps.preview.outputs.url }}
