name: Craft CMS preview on Forge
description: Create, update and tear down per-PR Craft CMS preview sites on a Laravel Forge server, gated by the `preview` label.

inputs:
  command:
    description: "Optional override: up, down or sweep. By default the action decides from the PR event and the preview label."
    default: ""
  config-path:
    description: Path to the client's preview manifest
    default: .craft-preview.json
  workspace:
    description: Checkout directory holding the manifest and the site's .env.example
    default: ${{ github.workspace }}
  forge-token:
    description: Forge API token
    required: true
  forge-org:
    description: Forge organization slug
    required: true
  forge-server-id:
    description: ID of the dedicated preview server in Forge
    required: true
  preview-secret:
    description: Long random string. Per-preview DB passwords, security keys and admin passwords are derived from it.
    required: true
  basic-auth-user:
    default: preview
  basic-auth-password:
    required: true
  admin-email:
    description: Email of the control panel admin created on every preview
    default: previews@netlife.no
  extra-env:
    description: Extra KEY=VALUE lines appended to every preview's .env (use for client secrets)
    default: ""
  snapshot-key:
    description: Read-only DigitalOcean Spaces key for the snapshot bucket (the one verify uses)
    default: ""
  snapshot-secret:
    default: ""
  snapshot-bucket:
    default: netlife-craft-snapshots
  snapshot-region:
    default: fra1
  github-token:
    default: ${{ github.token }}

outputs:
  url:
    description: The preview URL (set by `up`)
    value: ${{ steps.run.outputs.url }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --omit=dev --no-audit --no-fund

    # Presigned for 7 days so the preview server never holds bucket credentials.
    - name: Presign DB snapshot
      id: snapshot
      if: inputs.snapshot-key != ''
      shell: bash
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.snapshot-key }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.snapshot-secret }}
        AWS_DEFAULT_REGION: ${{ inputs.snapshot-region }}
        BUCKET: ${{ inputs.snapshot-bucket }}
        CONFIG_PATH: ${{ inputs.config-path }}
      working-directory: ${{ inputs.workspace }}
      run: |
        key=$(jq -r '.snapshotKey // empty' "$CONFIG_PATH")
        if [ -n "$key" ]; then
          url=$(aws s3 presign "s3://$BUCKET/$key" --expires-in 604800 \
            --endpoint-url "https://$AWS_DEFAULT_REGION.digitaloceanspaces.com")
          echo "::add-mask::$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        fi

    - name: Run preview command
      id: run
      shell: bash
      working-directory: ${{ inputs.workspace }}
      env:
        COMMAND: ${{ inputs.command }}
        CONFIG_PATH: ${{ inputs.config-path }}
        WORKSPACE: ${{ inputs.workspace }}
        FORGE_TOKEN: ${{ inputs.forge-token }}
        FORGE_ORG: ${{ inputs.forge-org }}
        FORGE_SERVER_ID: ${{ inputs.forge-server-id }}
        PREVIEW_SECRET: ${{ inputs.preview-secret }}
        BASIC_AUTH_USER: ${{ inputs.basic-auth-user }}
        BASIC_AUTH_PASSWORD: ${{ inputs.basic-auth-password }}
        ADMIN_EMAIL: ${{ inputs.admin-email }}
        EXTRA_ENV: ${{ inputs.extra-env }}
        SNAPSHOT_URL: ${{ steps.snapshot.outputs.url }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: node "$GITHUB_ACTION_PATH/src/cli.ts" $COMMAND
